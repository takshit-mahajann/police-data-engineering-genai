name: policeDE

channels:
  - conda-forge
  - defaults

dependencies:
  - python=3.10.19
  - pip

  # --- Core data / pipeline stack ---
  - requests
  - pandas
  - python-dotenv
  - pyspark
  - streamlit
  - plotly

  # --- JVM required by PySpark ---
  # If rebuilding in Docker/a fresh VM, this must be present — it is
  # currently satisfied on the dev machine by a system-level (apt)
  # install, which will NOT carry over automatically.
  - openjdk=17

  - pip:
      # --- Dashboard auto-refresh ---
      - streamlit-autorefresh

      # --- MySQL connectivity (used by the chatbot) ---
      - sqlalchemy
      - pymysql
      - cryptography

      # --- Chatbot / LLM stack (versions pinned to what is verified
      # working — LangChain's package split changes frequently, so
      # leaving these unpinned risks a broken import right before a demo) ---
      - langchain==1.3.15
      - langchain-community==0.4.2
      - langchain-groq==1.1.3
      - langchain-core==1.6.0

# ------------------------------------------------------------------
# NOT covered by this file — must be installed separately at the OS
# level (conda cannot manage a running system service):
#
#   sudo apt update
#   sudo apt install -y mysql-server
#
# After installing, the root password / auth method still needs to be
# set manually (see project notes) before the chatbot can connect.
# ------------------------------------------------------------------